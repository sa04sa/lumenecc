version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lumenec_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trissyan_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  app:
    build: .
    container_name: lumenec_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      # L'application se connecte au service 'db' via le réseau Docker
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=trissyan_db
      - DB_PORT=3306
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
